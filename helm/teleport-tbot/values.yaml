enabled: false

global:
  podSecurityStandards:
    enforced: false

ciliumNetworkPolicy:
  enabled: false

image:
  name: "giantswarm/tbot-distroless"
registry:
  domain: gsoci.azurecr.io

cronjob:
  enabled: false
  image:
    name: "giantswarm/docker-kubectl"
    tag: "1.36.4"

teleport:
  tokenName: ""
  proxyAddr: test.teleport.giantswarm.io:443
  teleportClusterName: test.teleport.giantswarm.io
  teleportVersion: 18.4.0

pod:
  user:
    id: 1000
  group:
    id: 1000

resources:
  limits:
    cpu: 250m
    memory: 500Mi
  requests:
    cpu: 100m
    memory: 250Mi

# Add seccomp to pod security context
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
  runAsNonRoot: true

# Add seccomp to container security context
containerSecurityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

renewal_interval: "20m"
# Lifetime tbot requests for its credentials (the server may cap it). Defaults to 24h when empty. Replaces the
# deprecated certificate_ttl, which is still honoured when credential_ttl is empty.
credential_ttl: ""
# Deprecated: use credential_ttl.
# certificate_ttl: ""

# Controls the default output configured for the tbot agent.
defaultOutput:
  enabled: true
  # Sets the name of the Kubernetes Secret that the default output will be written to.
  secretName: "teleport-identity-output"

# outputs(map)
# outputs:
#   golem: "golem"
#   golem-demo: "demo"

# Target CPU architecture for the tbot Deployment and the cleanup CronJob. Empty
# imposes no constraint. `arm64` pins the pods to arm64 nodes, adding both the
# `kubernetes.io/arch` node selector and the toleration for the
# `kubernetes.io/arch=arm64:NoSchedule` taint that Giant Swarm arm64 node pools
# carry. Both are required, so this single value sets both. Requires multi-arch
# container images; the default tbot-distroless and docker-kubectl images are.
# An amd64-only image will crash-loop with `exec format error` on an arm64 node.
architecture: ""

# Node selector for pod scheduling. Merged with `architecture`. Pinning to arm64
# here rather than through `architecture` also adds the arm64 taint toleration,
# so either route is safe. A value that contradicts `architecture` fails the
# render.
nodeSelector: {}

# Tolerations for pod scheduling.
tolerations: []
